[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseops"
version = "0.1.0"
description = "Drop-in observability SDK for production LLM applications"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pulseops*"]